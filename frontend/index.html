<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创作助手 - 人生故事 & AI小说</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/interview.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="topbar">
        <div class="topbar-left">
            <button class="btn-icon" id="btn-toggle-sidebar">&#9776;</button>
            <h1 class="app-title">创作助手</h1>
            <div class="module-tabs">
                <button class="module-tab active" data-module="story">人生故事</button>
                <button class="module-tab" data-module="novel">AI小说</button>
            </div>
        </div>
        <div class="topbar-center" id="topbar-info"></div>
        <div class="topbar-right">
            <button class="btn btn-sm" id="btn-font-big">A+</button>
            <button class="btn btn-sm" id="btn-font-small">A-</button>
            <button class="btn btn-sm" id="btn-export">导出</button>
            <button class="btn btn-sm btn-primary" id="btn-create">+ 新建</button>
        </div>
    </header>

    <div class="main-layout">
        <!-- 左侧栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-section" id="sidebar-list-section">
                <div class="sidebar-header"><span id="sidebar-list-title">我的故事</span></div>
                <ul class="novel-list" id="item-list"></ul>
            </div>
            <div class="sidebar-section" id="sidebar-extra"></div>
        </aside>

        <!-- 主区域 -->
        <main class="main-area" id="main-area">
            <!-- 空状态 -->
            <div class="empty-state" id="empty-state">
                <div class="empty-icon">&#128214;</div>
                <h2 id="empty-title">每个人的人生都值得被写成一本好书</h2>
                <p id="empty-desc">AI 会像一位温暖的记者一样采访你</p>
                <button class="btn btn-primary btn-lg" id="btn-empty-create">+ 开始创作</button>
            </div>

            <!-- ====== 人生故事：聊天采访 ====== -->
            <div class="chat-container" id="story-container" style="display:none">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-bar">
                    <textarea id="chat-input" placeholder="在这里输入你的回答..." rows="2"></textarea>
                    <button class="btn btn-primary" id="btn-send">&#10148;</button>
                </div>
            </div>

            <!-- ====== AI小说：写作编辑器 ====== -->
            <div class="editor-container" id="novel-container" style="display:none">
                <div class="editor-header">
                    <input type="text" class="chapter-title-input" id="novel-chapter-title" placeholder="章节标题...">
                    <span class="word-count" id="novel-word-count">0 字</span>
                    <select class="chapter-status" id="novel-chapter-status">
                        <option value="draft">草稿</option><option value="revising">修改中</option><option value="complete">已完成</option>
                    </select>
                </div>
                <div class="editor-body">
                    <textarea class="editor-textarea" id="novel-editor" placeholder="开始写作...选中文字后使用右侧AI面板"></textarea>
                </div>
            </div>

            <!-- 共用：时间线 -->
            <div class="timeline-container" id="timeline-container" style="display:none">
                <div class="timeline-header"><h3>时间线</h3></div>
                <div class="timeline-track" id="timeline-track"></div>
            </div>

            <!-- 共用：章节/分镜 -->
            <div class="chapters-container" id="chapters-container" style="display:none">
                <div class="chapters-header">
                    <h3 id="chapters-title">章节</h3>
                    <button class="btn btn-sm btn-primary" id="btn-generate-chapter">AI 生成</button>
                </div>
                <div class="chapters-list" id="chapters-list"></div>
            </div>

            <!-- 共用：人物/角色 -->
            <div class="persons-container" id="persons-container" style="display:none">
                <div class="char-header">
                    <h3 id="persons-title">人物</h3>
                    <button class="btn btn-sm btn-primary" id="btn-add-person">+ 添加</button>
                </div>
                <div class="char-grid" id="person-grid"></div>
            </div>
        </main>

        <!-- 右侧 AI 面板（小说模式） -->
        <aside class="ai-panel" id="novel-ai-panel" style="display:none">
            <div class="ai-panel-header"><h3>AI 写作助手</h3></div>
            <div class="ai-actions">
                <button class="ai-btn" data-action="continue">&#9998; 续写</button>
                <button class="ai-btn" data-action="polish">&#10003; 润色</button>
                <button class="ai-btn" data-action="dialogue">&#128172; 对话</button>
                <button class="ai-btn" data-action="scene">&#127758; 场景</button>
                <button class="ai-btn" data-action="suggest">&#128161; 建议</button>
            </div>
            <div class="ai-style">
                <label>风格提示</label>
                <input type="text" id="ai-style-guide" placeholder="例如：保持悬疑感...">
            </div>
            <div class="ai-dialogue-options" id="ai-dialogue-options" style="display:none">
                <label>角色名称</label>
                <input type="text" id="ai-char-name" placeholder="输入角色名">
            </div>
            <div class="ai-output" id="ai-output">
                <div class="ai-placeholder">选中文字后点击上方按钮</div>
            </div>
            <div class="ai-output-actions" id="ai-output-actions" style="display:none">
                <button class="btn btn-sm btn-primary" id="btn-accept-ai">插入</button>
                <button class="btn btn-sm" id="btn-discard-ai">丢弃</button>
            </div>
        </aside>

        <!-- 底部导航（故事模式） -->
        <nav class="bottom-nav" id="story-nav" style="display:none">
            <button class="nav-btn active" data-view="chat">&#128172; 采访</button>
            <button class="nav-btn" data-view="timeline">&#128197; 时间线</button>
            <button class="nav-btn" data-view="chapters">&#128214; 章节</button>
            <button class="nav-btn" data-view="persons">&#128101; 人物</button>
        </nav>
    </div>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="modal-overlay" style="display:none">
        <div class="modal" id="modal"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/interview.js"></script>
</body>
</html>
