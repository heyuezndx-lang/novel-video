<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生故事写作助手</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/interview.css">
</head>
<body>
    <header class="topbar" id="topbar">
        <div class="topbar-left">
            <button class="btn-icon" id="btn-toggle-sidebar">&#9776;</button>
            <h1 class="app-title">人生故事</h1>
        </div>
        <div class="topbar-center" id="topbar-story-info"></div>
        <div class="topbar-right">
            <button class="btn btn-sm" id="btn-font-big" title="放大字体">A+</button>
            <button class="btn btn-sm" id="btn-font-small" title="缩小字体">A-</button>
            <button class="btn btn-sm" id="btn-export-story">导出</button>
            <button class="btn btn-sm btn-primary" id="btn-new-story">+ 新故事</button>
        </div>
    </header>

    <div class="main-layout" id="main-layout">
        <!-- 左侧栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-header"><span>我的故事</span></div>
                <ul class="novel-list" id="story-list"></ul>
            </div>
            <div class="sidebar-section" id="topic-section" style="display:none">
                <div class="sidebar-header"><span>人生话题</span></div>
                <div class="topic-list" id="topic-list"></div>
            </div>
            <div class="sidebar-section" id="session-section" style="display:none">
                <div class="sidebar-header"><span>进度</span></div>
                <div class="progress-info" id="progress-info"></div>
            </div>
        </aside>

        <!-- 主区域 -->
        <main class="main-area" id="main-area">
            <!-- 空状态 -->
            <div class="empty-state" id="empty-state">
                <div class="empty-icon">&#128214;</div>
                <h2>每个人的人生都值得被写成一本好书</h2>
                <p>点击「新故事」开始，AI 会像一位温暖的记者一样采访你</p>
                <button class="btn btn-primary btn-lg" id="btn-empty-create">+ 创建我的人生故事</button>
            </div>

            <!-- 采访聊天界面 -->
            <div class="chat-container" id="chat-container" style="display:none">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-bar">
                    <button class="btn btn-mic" id="btn-mic" title="按住说话">🎤</button>
                    <textarea id="chat-input" placeholder="在这里输入你的回答..." rows="2"></textarea>
                    <button class="btn btn-primary" id="btn-send" title="发送">&#10148;</button>
                </div>
            </div>

            <!-- 时间线视图 -->
            <div class="timeline-container" id="timeline-container" style="display:none">
                <div class="timeline-header">
                    <h3>人生时间线</h3>
                    <div class="tl-filters">
                        <select id="tl-filter-category">
                            <option value="">全部</option>
                            <option value="childhood">童年</option>
                            <option value="family">家庭</option>
                            <option value="education">求学</option>
                            <option value="career">事业</option>
                            <option value="love">爱情</option>
                            <option value="parenting">育儿</option>
                            <option value="travel">旅途</option>
                            <option value="life_wisdom">感悟</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                </div>
                <div class="timeline-track" id="timeline-track"></div>
            </div>

            <!-- 章节预览 -->
            <div class="chapters-container" id="chapters-container" style="display:none">
                <div class="chapters-header">
                    <h3>成书预览</h3>
                    <button class="btn btn-sm btn-primary" id="btn-generate-chapter">AI 生成章节</button>
                </div>
                <div class="chapters-list" id="chapters-list"></div>
            </div>

            <!-- 人物列表 -->
            <div class="persons-container" id="persons-container" style="display:none">
                <div class="char-header"><h3>故事中的人物</h3></div>
                <div class="char-grid" id="person-grid"></div>
            </div>
        </main>

        <!-- 底部导航 -->
        <nav class="bottom-nav" id="bottom-nav" style="display:none">
            <button class="nav-btn active" data-view="chat">&#128172; 采访</button>
            <button class="nav-btn" data-view="timeline">&#128197; 时间线</button>
            <button class="nav-btn" data-view="chapters">&#128214; 章节</button>
            <button class="nav-btn" data-view="persons">&#128101; 人物</button>
        </nav>
    </div>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="modal-overlay" style="display:none">
        <div class="modal" id="modal"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/interview.js"></script>
    <script src="js/voice.js"></script>
</body>
</html>
